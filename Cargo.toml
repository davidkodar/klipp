[workspace]
members = [
    "crates/klipp-core",
    "crates/klipp-linebreak",
    "crates/klipp-convert",
    "crates/klipp-project",
    "crates/klipp-timeline",
    "crates/klipp-media",
    "crates/klipp-captions",
    "crates/klipp-audio",
    "crates/klipp-color",
    "crates/klipp-grade-model",
    "crates/klipp-engine",
    "crates/klipp-plugin",
    "crates/klipp-frei0r",
    "crates/klipp-load-lock",
    "crates/klipp-effects",
    "crates/klipp-nodes",
    "crates/klipp-title",
    "crates/klipp-transitions",
    "crates/klipp-validation",
    "crates/klipp-render",
    "crates/klipp-compose",
    "crates/klipp-export",
    "crates/klipp-ml",
    "crates/klipp-deepfilter",
    "crates/klipp-ml-candle",
    "crates/klipp-ml-ort",
    "crates/klipp-ui",
    "crates/klipp-app",
    "crates/klipp-jobs",
    "crates/klipp-testing",
    "crates/klipp-readiness",
    "crates/klipp-corpus",
    "crates/klipp-perf",
    "crates/klipp-smoke",
    "crates/klipp-control",
    "crates/klipp-document",
    "crates/klipp-analysis",
    "crates/klipp-hdr-out",
    "crates/klipp-mcp",
    "crates/klipp-audio-search",
    "crates/klipp-graph-format",
    "crates/klipp-graph-lift",
]
resolver = "2"

# ─── What every crate in the workspace says about itself ────────────────────
# Klipp is GPL-3.0, and each crate has to say so itself: cargo does not
# infer a licence from a LICENSE file at the repo root, so a crate with
# no `license` field reads as unlicensed to anything mechanical —
# `cargo deny check licenses` reported all 33 of ours that way.
#
# GPL-3.0-only rather than -or-later, to match the ffmpeg we link
# (Arch's is GPL-3.0-only). MIT was considered and declined in September
# 2026: every Rust crate in the tree is permissive, but the ffmpeg build
# we link is GPL because of x264/x265, and frei0r is GPL-2.0-or-later.
# A permissive label would have been a false one unless we shipped our
# own LGPL ffmpeg and gave up software H.264/H.265 export.
[workspace.package]
# The release version for every Klipp crate and application version display.
# Preserve prerelease identifiers, e.g. 0.20.0-rc.1 or 1.0.0-beta.1.
version = "0.2.0"
license = "GPL-3.0-only"

# ─── Shared dependency versions across all crates ───────────────────────────
# Lints the workspace deliberately declines, each with the reason.
#
# The point of this table is that clippy's output should be empty, so the
# *next* warning is visible. Everything here was read individually before
# being allowed — none of it is a blanket silence, and a few of clippy's
# suggestions would actively make this code worse.
[workspace.lints.clippy]
# 182 hits, nearly all in klipp-color. These are published constants —
# ACES coefficients, primaries matrices, transfer curve terms — written to
# their full documented precision. f32 cannot hold all of it, which is
# exactly what the lint says, but truncating them to what f32 *can* hold
# destroys the provenance of the number and makes the source
# unverifiable against the spec it came from.
excessive_precision = "allow"
# `chunks_exact(4)` over interleaved RGBA is the clearest possible
# spelling of "one pixel at a time". The suggested `as_chunks::<4>().0
# .iter()` is harder to read, and applying it mechanically rewrote 71
# sites in hot pixel loops for an unmeasured benefit.
chunks_exact_to_as_chunks = "allow"
# A colour pipeline's functions genuinely take many parameters — planes,
# strides, dimensions, rotation, colour ids, a matrix. "Fixing" this means
# introducing parameter structs in the hottest code in the project, for no
# behavioural gain.
too_many_arguments = "allow"
# Indexing by hand is clearer than an iterator when a loop indexes
# *several* slices at once, which is most of the per-pixel code here.
needless_range_loop = "allow"
# These are deliberate guards pinning a constant, with messages saying so
# ("cap must stay bounded so a buggy plugin can't hang the host"). Clippy
# flags them because it can evaluate them at compile time — which is
# precisely why they work.
assertions_on_constants = "allow"
# `drop(x)` on a non-Drop type to end a borrow before the borrowed buffer
# is reused. Commented at the site; the call is doing real work even
# though the type has no destructor.
drop_non_drop = "allow"
# `AVCOL_*_UNSPECIFIED | _ => fallback` in the ffmpeg tag decoders. The
# named arm is redundant and documents that an unspecified tag maps to the
# fallback on purpose rather than by omission.
wildcard_in_or_patterns = "allow"
# `(1 * w + 2)` in a test, written as `(y * w + x)` so the coordinate
# reads as row 1, column 2.
identity_op = "allow"
# The same habit at the other end: `result[0 * 4 + 1]` reads as "pixel 0,
# channel green" and sits next to `result[7 * 4 + 1]`. Clippy is right
# that the product is zero; that is not the point of writing it.
erasing_op = "allow"
# `!(nits > 0.0)` is a NaN guard: true for NaN, zero and negatives.
# Clippy's suggested `nits <= 0.0` is *false* for NaN and would let it
# through, so taking this suggestion would be a regression.
neg_cmp_op_on_partial_ord = "allow"
# Factoring a closure-heavy signature into `type` aliases moves the
# information away from where it is read.
type_complexity = "allow"
# Renaming a public `as_mut` would be an API break for a naming
# preference.
should_implement_trait = "allow"

[workspace.dependencies]

# Fast compression for render cache
lz4_flex = "0.11"

# Core async runtime
tokio = { version = "1", features = ["full"] }

# Serialization (project format)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallel processing
rayon = "1"

# UUID for clip/track/node IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Math / linear algebra (for transforms, matrices)
glam = { version = "0.27", features = ["serde"] }

# UI
egui = "0.29"
eframe = { version = "0.29", features = ["wgpu", "glow"] }
egui_extras = { version = "0.29", features = ["svg"] }

# GPU
wgpu = "22"

# Audio
cpal = "0.15"
dasp = { version = "0.11", features = ["all"] }
symphonia = { version = "0.5", features = ["all"] }

# FFmpeg (decode + export)
ffmpeg-next = "9.0"

# Audio resampling
rubato = "0.15"

# Lock-free ring buffer
ringbuf = "0.4"

# Safe transmute for GPU buffer data
bytemuck = { version = "1.14", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }

# OpenColorIO (color management)
# Note: requires system libOpenColorIO - bindings via C FFI
# opencolorio = { version = "0.2" }  # Phase 2+

# Filesystem / paths
walkdir = "2"
dirs = "5"
pathdiff = "0.2"
notify = "6"

# Channels / messaging between threads
crossbeam-channel = "0.5"

# Lock-free MPSC/SPSC queues (ArrayQueue used for UI→engine param change batching)
crossbeam-queue = "0.3"

# Dynamic library loading (OFX plugins)
libloading = "0.8"

flume = "0.11"
pollster = "0.4"

# TOML parser — model manifest in klipp-ml
toml = "0.8"

# SHA-256 + hex encoding — model checksum verification
sha2 = "0.10"
hex = "0.4"

# Blocking HTTPS client — one-shot model downloads in klipp-ml
# (reqwest pulls async + extra deps; ureq is lighter for foreground DLs)
ureq = { version = "2", features = ["tls"] }

# Bit-flag capability sets for klipp-ml's MaskGenerator trait
# (multiple narrow capabilities matched cleanly via |/&)
bitflags = { version = "2", features = ["serde"] }

# ONNX Runtime — pinned to 2.0.0-rc.12 (RC since 2024, production-stable).
# Uses `load-dynamic`: the build never downloads anything; users point at
# their existing libonnxruntime.so via `ORT_DYLIB_PATH=...`. Distros
# package onnxruntime; Klipp's release builds ship the .so next to the
# binary. `download-binaries` was the alternative but rc.12's build
# script bit-rotted against newer ureq. Lives behind klipp-ml-ort/ort
# feature flag — default Klipp build does not pull this in.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }

# Internal crates
klipp-core    = { path = "crates/klipp-core" }
klipp-project = { path = "crates/klipp-project" }
klipp-timeline = { path = "crates/klipp-timeline" }
klipp-graph-format = { path = "crates/klipp-graph-format" }
klipp-graph-lift = { path = "crates/klipp-graph-lift" }
klipp-transitions = { path = "crates/klipp-transitions" }
klipp-validation  = { path = "crates/klipp-validation" }
klipp-media   = { path = "crates/klipp-media" }
klipp-captions = { path = "crates/klipp-captions" }
klipp-audio   = { path = "crates/klipp-audio" }
klipp-color   = { path = "crates/klipp-color" }
klipp-grade-model = { path = "crates/klipp-grade-model" }
klipp-engine  = { path = "crates/klipp-engine" }
klipp-plugin  = { path = "crates/klipp-plugin" }
klipp-frei0r = { path = "crates/klipp-frei0r" }
klipp-load-lock = { path = "crates/klipp-load-lock" }
klipp-effects = { path = "crates/klipp-effects" }
klipp-nodes   = { path = "crates/klipp-nodes" }
klipp-title  = { path = "crates/klipp-title" }
klipp-render  = { path = "crates/klipp-render" }
klipp-compose = { path = "crates/klipp-compose" }
klipp-export  = { path = "crates/klipp-export" }
klipp-ml         = { path = "crates/klipp-ml" }
klipp-deepfilter = { path = "crates/klipp-deepfilter" }
klipp-ml-candle  = { path = "crates/klipp-ml-candle" }
klipp-ml-ort     = { path = "crates/klipp-ml-ort" }
klipp-ui      = { path = "crates/klipp-ui" }
klipp-testing = { path = "crates/klipp-testing" }
klipp-control = { path = "crates/klipp-control" }
klipp-document = { path = "crates/klipp-document" }
klipp-analysis = { path = "crates/klipp-analysis" }
klipp-hdr-out = { path = "crates/klipp-hdr-out" }
klipp-mcp = { path = "crates/klipp-mcp" }
klipp-audio-search = { path = "crates/klipp-audio-search" }

# ─── Workspace-wide profile settings ────────────────────────────────────────
[profile.dev]
opt-level = 1          # Minimal optimization — faster compile, still debuggable
# Line tables only: panics and backtraces keep file and line, while test
# binaries are several times smaller, so links and target folders shrink.
debug = "line-tables-only"

# The former dev profile, full debug info, for stepping through a test in
# a debugger: `cargo test --profile dev-full-debug ...`. Its own folder
# under target/, so switching to it doesn't rebuild the dev builds.
[profile.dev-full-debug]
inherits = "dev"
debug = true

[profile.dev.package."*"]
opt-level = 3          # But optimize all dependencies fully even in dev

[profile.dev.package.klipp-effects]
opt-level = 3          # Per-pixel math must be fast even in debug builds

[profile.release]
opt-level = 3
lto = "thin"           # Link-time optimization for smaller/faster binary
codegen-units = 8      # Smaller LLVM units to keep LTO from blowing its stack
                       # (was 1, then 4; klipp-ui growth pushed us to 8).
# Line tables (no full DWARF) so panics produce useful backtraces while
# we hunt the wgpu TextureView lifetime crash. Adds ~5-10 MB to the
# binary, no perf cost. Revert to `strip = true` once the crash is
# fixed and we no longer need release-mode symbols.
debug = "line-tables-only"
strip = false
panic = "abort"        # Smaller binary, no unwinding overhead

[profile.profiling]
inherits = "release"
debug = true           # Keep debug info for profiling with perf/tracy
strip = false

# egui-wgpu 0.29.1 with textures freed after the frame's submit instead
# of before it (see vendor/egui-wgpu/KLIPP-PATCH.md). Upstream's order
# aborted the app whenever a texture was freed in the frame it was drawn.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
# winit 0.30.13 with the Wayland frame-callback wait bounded at 100 ms (see
# vendor/winit/KLIPP-PATCH.md). Unbounded, Hyprland's once-a-second callbacks
# on an idle desktop left the app painting once a second under input.
winit = { path = "vendor/winit" }
# wgpu-core 22.1.0 with the queue's write paths taking the snatch lock before
# `pending_writes`, as `queue_submit` does (see vendor/wgpu-core/KLIPP-PATCH.md).
# The other order deadlocked the engine, a decoder and the UI on the shared
# device: playback froze at a cut under an overlay.
wgpu-core = { path = "vendor/wgpu-core" }
