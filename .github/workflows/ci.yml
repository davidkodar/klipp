# Dormant while the repository is private. Both jobs are guarded on
# `repository.private == false`, so they are skipped — at no cost in
# Actions minutes — until the day the repo goes public, and switch
# themselves on that day with no edit needed.
#
# That is the right moment for two reasons at once: minutes are free on
# public repositories, and public is when contributors appear who cannot
# be made to install the pre-push hook. Until then everyone pushing here
# has it, and it is a strictly better gate than this workflow — the
# machine it runs on has a GPU.
#
# While private, the same authorship rules are enforced by
# scripts/check-signoff.sh from the hook, instantly and for nothing.
#
# When it does run: advisory. Read the "On CI, and why the real gate is
# local" section of CONTRIBUTING.md before trusting a green tick.
#
# The short version: Klipp's correctness argument for the colour
# pipeline is that its CPU and GPU paths agree, and ~90 of the tests
# that check that are written to skip when a GPU constructor returns
# None. On a runner with no GPU they skip silently and the suite reports
# a confident green on a build that may be broken. That is why the real
# gate is scripts/pre-push.sh, on a machine with real hardware.
#
# What this still buys: lavapipe (Mesa's software Vulkan driver) gives
# the runner a real Vulkan adapter, so shaders are genuinely compiled
# and klipp-effects' gpu_pipelines_build canary genuinely fires. A
# shader that stops compiling is caught here, which was the single
# largest hole a GPU-less runner would have left.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # lavapipe is software rendering: generous, but not unbounded.
  WGPU_BACKEND: vulkan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: clippy, rustdoc, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Skipped entirely while private: a cold build of this workspace
    # (ffmpeg and whisper.cpp both build C) would spend the month's
    # budget in a handful of runs.
    if: github.event.repository.private == false

    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev libavdevice-dev \
            libclang-dev lld cmake pkg-config \
            libvulkan-dev vulkan-tools glslc \
            libasound2-dev libpipewire-0.3-dev liblilv-dev \
            libgtk-3-dev libxkbcommon-dev
          # lavapipe: a real Vulkan adapter in software, so shaders compile
          # for real and the GPU canary is not a no-op.
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Show the Vulkan adapter we got
        run: vulkaninfo --summary || true

      - uses: dtolnay/rust-toolchain@master
        with:
          # rust-toolchain.toml pins the version; this honours it.
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # ffmpeg-sys and whisper-rs build C; caching them is most of the
          # difference between a 10-minute run and a 40-minute one.
          cache-on-failure: true

      - name: Lay out the Vulkan SDK the speech model's build expects
        run: ./scripts/vulkan-sdk.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Tests
        run: cargo test --workspace

  dco:
    name: sign-off
    runs-on: ubuntu-24.04
    # Cheap, but a private-repo job still bills a whole minute, and at
    # this project's rate that is a third of the budget for something
    # the hook already did. scripts/check-signoff.sh is the same three
    # checks, locally.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off, by a person
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            author=$(git log -1 --format='%an <%ae>' "$sha")

            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::$sha ($subject) has no Signed-off-by line. Use 'git commit -s'."
              fail=1
            fi

            # Authorship is a statement about who is answerable for the
            # code. A model cannot be answerable for anything, so it is
            # never the author, the committer or a co-author.
            # Anchored deliberately: a loose pattern would reject a
            # contributor called Abbott. Names must *start* with the
            # agent's name; emails must be at a known vendor domain.
            if git log -1 --format='%an%n%cn' "$sha" \
                 | grep -qiE '^(claude|copilot|chatgpt|codex|cursor|devin|gpt-|openai|anthropic|github-actions)\b' \
               || git log -1 --format='%ae%n%ce' "$sha" \
                 | grep -qiE '@(anthropic|openai|users\.noreply\.anthropic)\.com$'; then
              echo "::error::$sha ($subject) is authored or committed by what looks like an AI agent: $author"
              echo "::error::Commit under your own name and email. See CONTRIBUTING.md."
              fail=1
            fi

            if git log -1 --format=%B "$sha" | grep -qi '^Co-Authored-By:'; then
              echo "::error::$sha ($subject) carries a Co-Authored-By trailer. Klipp does not use them."
              fail=1
            fi
          done < <(git rev-list "$base..$head")
          exit $fail
