# Klipp's built-in delivery specs (#2887): what each platform or
# broadcaster asks of a delivery, and what picking it sets on the Export
# page. Every number is from the page cited beside it, read 2026-10-25; a
# platform's recommendation is checked as one (`recommended`: a miss
# warns). Ids are fixed, so a project or a preference that names one keeps
# it across versions. A person's own specs are kept apart, in
# delivery-specs.json, in the same fields.
format_version = 1
kind = "delivery_spec"

# YouTube's recommended upload settings: MP4, H.264, BT.709, AAC
# or Opus at 48 kHz, stereo or 5.1; all recommendations. No
# loudness target is published.
# https://support.google.com/youtube/answer/1722171
[[spec]]
id = "delivery-youtube-sdr"
name = "YouTube (SDR)"
built_in = true
sources = ["https://support.google.com/youtube/answer/1722171"]
hdr = "Sdr"

[spec.export]
format = "Mp4"
video_codec = "H264"
crf = 18
preset = "Medium"
audio_codec = "Aac"
audio_bitrate_kbps = 384
rate_control = "Crf"
target_lufs = -14.0
bit_depth = 0

[spec.export.resolution]
width = 1920
height = 1080

[spec.requirements]
containers = ["Mp4"]
video_codecs = ["H264"]
frame_sizes = []
frame_rates = []
transfer = "Sdr"
audio_codecs = [
    "Aac",
    "Opus",
]
sample_rates = [48000]
channels = [
    1,
    2,
    6,
]
captions = "Any"
recommended = true

# YouTube HDR: PQ or HLG, Rec. 2020, 10- or 12-bit, 720p to 2160p,
# these frame rates (requirements); HEVC, VP9 or AV1 in MP4, MOV
# or MKV recommended, ProRes accepted.
# https://support.google.com/youtube/answer/7126552
[[spec]]
id = "delivery-youtube-hdr"
name = "YouTube (HDR)"
built_in = true
sources = [
    "https://support.google.com/youtube/answer/7126552",
