crf = 18
preset = "Medium"
audio_codec = "Aac"
audio_bitrate_kbps = 384
rate_control = "Crf"
target_lufs = -14.0
bit_depth = 10

[spec.export.resolution]
width = 3840
height = 2160

[spec.requirements]
containers = [
    "Mp4",
    "Mov",
    "Mkv",
]
video_codecs = [
    "H265",
    "Vp9",
    "Av1",
    "ProRes422",
    "ProRes422HQ",
    "ProRes4444",
]
frame_sizes = []
min_height = 720
frame_rates = [
    23.976023976023978,
    24.0,
    25.0,
    29.97002997002997,
    30.0,
    48.0,
    50.0,
    59.94005994005994,
    60.0,
]
min_bit_depth = 10
transfer = "Hdr"
audio_codecs = [
    "Aac",
    "Opus",
]
sample_rates = [48000]
channels = []
captions = "Any"
recommended = false

