# EBU R 128: programme loudness -23.0 LUFS over the whole
# programme, true peak at most -1 dBTP. Tolerance: EBU's R 128
# page gives ±0.5 LU; the v5 text keeps ±1.0 LU for live
# programmes and ±0.2 LU as a measurement tolerance.
# https://tech.ebu.ch/files/live/sites/tech/files/shared/r/r128.pdf
# https://tech.ebu.ch/publications/r128
[[spec]]
id = "delivery-ebu-r128"
name = "Broadcast: EBU R 128"
built_in = true
sources = [
    "https://tech.ebu.ch/files/live/sites/tech/files/shared/r/r128.pdf",
    "https://tech.ebu.ch/publications/r128",
]
hdr = "Sdr"

[spec.export]
format = "Mov"
video_codec = "ProRes422HQ"
crf = 18
preset = "Medium"
audio_codec = "Pcm24"
audio_bitrate_kbps = 0
rate_control = "Crf"
target_lufs = -23.0
true_peak_dbtp = -1.0
bit_depth = 10

[spec.requirements]
containers = []
video_codecs = []
frame_sizes = []
frame_rates = []
audio_codecs = []
sample_rates = []
channels = []
captions = "Any"
recommended = false

[spec.requirements.loudness]
target = -23.0
tolerance = 0.5
true_peak_max = -1.0
dialogue_gated = false

