# Klipp's built-in project formats (#2887): what the New Project dialog,
# the welcome screen and Sequence Settings offer. A format is named for
# what it is for, with its picture in pixels, the frame rates it is made
# at (the first the usual one, each a numerator and denominator) and
# whether it is graded for HDR delivery. The picture sizes and the frame
# rates are the dialogs' own lists. "Match first clip", "Automatic" and
# "Custom..." are what the dialogs do, not presets, and are not here.
kind = "project_formats"
format_version = 1

[[format]]
name = "HD 1080p"
width = 1920
height = 1080
rates = [[25, 1], [30000, 1001], [24000, 1001]]

[[format]]
name = "UHD 4K"
width = 3840
height = 2160
rates = [[25, 1], [30000, 1001], [24000, 1001]]

[[format]]
name = "DCI 4K (cinema)"
width = 4096
height = 2160
rates = [[24, 1]]

[[format]]
name = "Vertical (social)"
width = 1080
height = 1920
rates = [[30, 1]]

[[format]]
name = "Square (social)"
width = 1080
height = 1080
rates = [[30, 1]]

[[format]]
name = "HDR UHD (HLG / PQ)"
width = 3840
height = 2160
rates = [[25, 1], [30000, 1001]]
hdr = true

# Destinations (#3307): a format for where the piece goes. Besides the
# picture and rate, a project made from one puts the platform, its
# loudness and whether it is captioned in the sequence's brief, which
# the Delivery Check and the export read. Its overlays are the viewer's
# outlines of where those platforms' buttons and captions sit, by id.

[[format]]
name = "YouTube"
width = 1920
height = 1080
rates = [[30, 1], [25, 1], [24, 1], [60, 1]]
destination = { platform = "YouTube", loudness_lufs = -14.0, overlays = ["youtube"] }

[[format]]
name = "YouTube Shorts / Reels / TikTok"
width = 1080
height = 1920
rates = [[30, 1], [60, 1]]
destination = { platform = "YouTube Shorts, Instagram Reels, TikTok", loudness_lufs = -14.0, captions = true, overlays = ["youtube_shorts", "instagram_reels", "tiktok"] }

[[format]]
name = "Square post"
width = 1080
height = 1080
rates = [[30, 1]]
destination = { platform = "Instagram feed", loudness_lufs = -14.0, captions = true }

# Sound with a still or a waveform over it.
[[format]]
