# Klipp's built-in project formats (#2887): what the New Project dialog,
# the welcome screen and Sequence Settings offer. A format is named for
# what it is for, with its picture in pixels, the frame rates it is made
# at (the first the usual one, each a numerator and denominator) and
# whether it is graded for HDR delivery. The picture sizes and the frame
# rates are the dialogs' own lists. "Match first clip", "Automatic" and
# "Custom..." are what the dialogs do, not presets, and are not here.
kind = "project_formats"
format_version = 1

[[format]]
name = "HD 1080p"
width = 1920
height = 1080
rates = [[25, 1], [30000, 1001], [24000, 1001]]

[[format]]
name = "UHD 4K"
width = 3840
height = 2160
rates = [[25, 1], [30000, 1001], [24000, 1001]]

[[format]]
