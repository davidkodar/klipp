# Klipp's built-in effect presets (#2887): each a name, a line saying what
# it is and the effect at its values, listed in the effect's presets in
# this order. A few also go by a key the ops and the app ask for them by:
# an old-film template's, a reflection surface's, a particle kind's. A
# person's own presets are kept apart, as JSON in their config folder.
kind = "effect_preset"
format_version = 1


# ── Bloom ──
[[preset]]
name = "Subtle"
description = "Gentle highlight enhancement"

[preset.effect]
type = "bloom"
threshold = 0.8
radius = 15.0
intensity = 0.25

[[preset]]
name = "Cinematic"
description = "Classic film bloom"

[preset.effect]
type = "bloom"
threshold = 0.65
radius = 25.0
intensity = 0.5

[[preset]]
name = "Dreamy"
description = "Heavy dreamlike glow"

