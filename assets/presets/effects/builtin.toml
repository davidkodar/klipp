type = "bloom"
threshold = 0.5
radius = 40.0
intensity = 0.8

[[preset]]
name = "Music Video"
description = "Intense overexposed look"

[preset.effect]
type = "bloom"
threshold = 0.4
radius = 35.0
intensity = 1.2


