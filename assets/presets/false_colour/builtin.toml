# Klipp's false colour palettes (#2887): what the viewer's False Colour
# Palette menu and the Preferences editor offer. Each a name and its stops,
# each stop a band of 8-bit luma (from, to, both included), the colour it
# is painted (RGB, 0 to 255) and what the band means. The first is the
# default.
kind = "false_colour_palette"
format_version = 1

