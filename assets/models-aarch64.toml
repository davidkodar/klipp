
# ── aarch64 only: appended to models.toml in aarch64 builds ──
#
# klipp-ml's BUILTIN_MANIFEST is this file after assets/models.toml when
# built for aarch64, and models.toml alone otherwise, so an x86_64 build
# never lists these. On aarch64 the x86_64-only downloads above are
# dropped as the manifest loads.
#
# The Piper engine for aarch64: Piper's official release, the same
# version as the x86_64 entry, unpacked under the same guards and caps.
# Checksum taken from the release asset on 2026-10-30.

