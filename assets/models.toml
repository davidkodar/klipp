# ── Remove Background ─────────────────────────────────────────────
# BiRefNet_lite — Swin-Tiny backbone, MIT license, single-input
# single-output mask. First user-facing AI feature for Klipp.
# Bundled URL points at HuggingFace's onnx-community mirror; bytes
# verified via SHA-256.

[[model]]
id = "birefnet_lite_v1"
display_name = "BiRefNet Lite"
size_bytes = 224005088
sha256 = "5600024376f572a557870a5eb0afb1e5961636bef4e1e22132025467d0f03333"
license = "MIT"
attribution = "ZhengPeng7 / BiRefNet (huggingface.co/onnx-community/BiRefNet_lite-ONNX)"
sources = [
    { url = "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx" },
]
kind = "mask_generator"
runtime = "ort"
prompts = ""

# ── Isolate Object (click-to-mask) ────────────────────────────────
# MobileSAM — TinyViT image encoder + SAM prompt encoder + mask
# decoder. Apache-2.0 license. ~40 MB. Pure-Rust through candle.

[[model]]
id = "mobile_sam_v1"
display_name = "MobileSAM"
size_bytes = 40613024
sha256 = "5ad43a841b57cc798e2837e251c15aa9f602868a1780d195459383d117784cf7"
license = "Apache-2.0"
attribution = "ChaoningZhang / MobileSAM (mirrored via lmz/candle-sam on HuggingFace)"
sources = [
    { url = "https://huggingface.co/lmz/candle-sam/resolve/main/mobile_sam-tiny-vitt.safetensors" },
]
kind = "mask_generator"
runtime = "candle"
# SAM family supports point clicks, box prompts, scribble, and
# auto-detect (everything mask).
prompts = "point | box | scribble"

# ── Detect Objects (multi-class instance segmentation) ───────────
# RF-DETR-Seg — transformer-based detector with per-instance masks.
# Apache-2.0 (code + checkpoints). Strict alternative to Ultralytics
# YOLO whose AGPL would force Klipp to AGPL too. COCO-91 trained.
#
# Two-tier lineup so users can pick speed vs accuracy:
#   - rf_detr_seg_v1: nano/preview tier (~134 MB, fast, noisier
#     classifier — confidently wrong on out-of-distribution scenes)
#   - rf_detr_seg_medium_v1: medium tier (~140 MB, similar speed,
#     genuinely accurate)

[[model]]
id = "rf_detr_seg_v1"
display_name = "RF-DETR-Seg (Preview)"
size_bytes = 134443363
sha256 = "42e3571cf64d70df6f6acf3c5dcf0fc4ecbf8bab46d819ca8e4e94d4cee4de9b"
license = "Apache-2.0"
attribution = "Roboflow / RF-DETR (mirrored via bukuroo/RF-DETR-Seg-ONNX on HuggingFace)"
sources = [
    { url = "https://huggingface.co/bukuroo/RF-DETR-Seg-ONNX/resolve/main/rf-detr-seg-preview.onnx" },
]
kind = "mask_generator"
runtime = "ort"
# Auto-detect — no user prompts. Each detection produces a
# MaskCandidate with bbox + class label + per-instance mask.
prompts = ""

# Medium tier — same architecture as Preview, different weights.
# No public ONNX exists at upstream Roboflow / community mirrors;
# this entry points at Klipp's HF mirror at
# huggingface.co/davidkodar/rf-detr-seg-medium-onnx, exported
# locally from `rfdetr.RFDETRSegMedium.export()` (Python). The HF
# mirror is the closest thing to a "public" ONNX of Medium today.
# Drop / repoint when upstream publishes a canonical mirror.
[[model]]
id = "rf_detr_seg_medium_v1"
display_name = "RF-DETR-Seg (Medium)"
size_bytes = 139278517
sha256 = "ac764d38d19183940d120f3333eb769dbca90100b6955f2cef2b3848565f7cf4"
license = "Apache-2.0"
attribution = "Roboflow / RF-DETR Medium (mirrored at davidkodar/rf-detr-seg-medium-onnx on HuggingFace, locally exported via rfdetr.RFDETRSegMedium.export)"
sources = [
    { url = "https://huggingface.co/davidkodar/rf-detr-seg-medium-onnx/resolve/main/rf_detr_seg_medium_v1.onnx" },
]
kind = "mask_generator"
runtime = "ort"
prompts = ""

