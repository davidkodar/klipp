[package]
name = "klipp-testing"
version = "0.1.0"
edition = "2021"
publish = false

# Test-only helper crate. Never pulled into production binaries:
# downstream crates should only depend on this via `[dev-dependencies]`.

[lib]
path = "src/lib.rs"

# dev-dependencies only — wired into the ground-truth spec tests that
# exercise the real linear-light pipeline implementations. The lib
# itself stays dependency-free so any crate can pull it in without
# pulling klipp-color transitively.
[dev-dependencies]
klipp-color = { workspace = true }
