# Klipp built-in Dark theme: flat neutral surfaces in the tradition of
# the grading suites, one cool accent for what is active or selected,
# and the playhead the only warm mark.
#
# This file is embedded in the binary at compile time
# (src/theme/registry.rs include_str!). User themes drop into
# ~/.config/klipp/themes/*.toml using the same schema: top-level `name`
# and a `[colors]` table that fills ThemeColors field-for-field. Every
# field is required.

name = "Dark"

[colors]
# ── Surfaces: darkest (void) → lightest (raised). Six greys, no tint. ──
bg_void       = "#0e0e10"
bg_deep       = "#151517"
bg_panel      = "#1b1b1e"
bg_panel_alt  = "#202024"
bg_raised     = "#2a2a2f"
bg_hover      = "#35353b"
# The frame around the viewers; the picture itself sits on black.
bg_viewer     = "#131315"

# ── Borders / dividers ──
border        = "#2c2c31"
border_light  = "#3a3a40"
resizer_idle  = "#3a3a40"

# ── Accent: a cool blue, for the active tool, the selected row, the
# focused control — and nothing decorative. ──
accent        = "#4a8fe7"
accent_dim    = "#2f5e9a"
# Translucent overlays, premultiplied (#rrggbbaa with channels scaled
# by alpha): the selected row and the focused viewer's outline.
accent_glow   = "#0d1a2a2e"
accent_subtle = "#101f3338"
# Secondary accent for things that must read as "not the accent":
# a muted violet.
accent_alt    = "#a78bdc"
# The playhead: the one warm mark in a neutral interface.
playhead       = "#ff5a3c"

# ── Text ──
text_primary   = "#e6e6e9"
text_secondary = "#a0a0a8"
text_dim       = "#6f6f78"
# Values and timecodes: a touch brighter than body text, no colour.
text_accent    = "#f2f2f4"
# Text on an accent-filled control: the blue is dark enough for white.
text_on_accent = "#ffffff"

# ── Functional marker / status colours ──
marker_error   = "#d64545"
marker_success = "#4fb86e"
marker_info    = "#4a8fe7"
marker_warning = "#d9a42b"

# ── Scope display tokens (instrument graticule stays amber on black) ──
scope_grid  = "#1e160720"
scope_label = "#907830"
scope_bg    = "#040407"

# ── Role colours (one per clip/track role), a little desaturated so
# the timeline reads as one surface. ──
role_video     = "#3d6f9e"
role_dialogue  = "#3f8a70"
role_music     = "#4f7fd0"
role_sfx       = "#a0623a"
role_title     = "#b04a40"
role_broll     = "#556f9c"
role_ambience  = "#8a4fa8"
role_foley     = "#c0466e"
role_voiceover = "#3aa3b5"
role_graphics  = "#c8b04a"
