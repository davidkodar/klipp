[package]
name = "klipp-ui"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = []
# Panics a test injects into the running app (#3181).
test-hooks = ["klipp-engine/test-hooks"]
# Observe old inspector rows in headless tests; absent from ordinary builds.
row-recorder = []
# Pulls in the ort-backed BiRefNet implementation. With this on,
# the AI Tools panel auto-registers BiRefNet for Remove Background.
# Requires libonnxruntime.so on the user's machine + ORT_DYLIB_PATH
# pointing at it (see klipp-ml-ort docs).
ai-ort = ["dep:klipp-ml-ort", "klipp-ml-ort/ort", "klipp-audio/kokoro"]
# NVIDIA acceleration via ort's CUDA execution provider. Implies
# ai-ort. Requires CUDA 12.8+/cuDNN 9.19+ on the user's machine.
ai-ort-cuda = ["ai-ort", "klipp-ml-ort/cuda", "klipp-analysis/cuda"]
# Pulls in the candle-backed MobileSAM implementation. Pure-Rust
# (no C library required at runtime). Auto-registers MobileSAM for
# Isolate Object (click-to-mask).
ai-candle = ["klipp-ml-candle/candle"]
# NVIDIA acceleration via candle's CUDA backend.
ai-candle-cuda = ["ai-candle", "klipp-ml-candle/cuda"]

[dependencies]
klipp-captions = { workspace = true }
klipp-color = { workspace = true }
klipp-grade-model = { workspace = true }
klipp-core = { workspace = true }
klipp-document = { workspace = true }
klipp-effects = { workspace = true }
klipp-frei0r = { workspace = true }
klipp-engine = { workspace = true }
klipp-jobs = { path = "../klipp-jobs" }
klipp-nodes = { workspace = true }
klipp-timeline = { workspace = true }
klipp-media = { workspace = true }
klipp-analysis = { workspace = true }
klipp-transitions = { workspace = true }
klipp-compose = { workspace = true }
klipp-validation = { workspace = true }
klipp-audio = { workspace = true }
klipp-plugin = { workspace = true }
klipp-export = { workspace = true }
klipp-render = { workspace = true }
klipp-ml = { workspace = true }
klipp-audio-search = { workspace = true }
klipp-ml-candle = { workspace = true }
klipp-ml-ort = { workspace = true, optional = true }
klipp-title = { workspace = true }
klipp-project = { workspace = true }
klipp-graph-lift = { workspace = true }
klipp-graph-format = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
wgpu = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
ureq = { workspace = true }
semver = "1"
uuid = { workspace = true }
tracing = { workspace = true }
rfd = "0.17"
# The desktop portal's appearance settings (theme/portal.rs). The same
# build the accessibility bridge already pulls in.
zbus = "4.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
dirs = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
egui_extras = { workspace = true }
chrono = { workspace = true }
bytemuck = { workspace = true }
libc = "0.2"

[dev-dependencies]
klipp-timeline = { workspace = true, features = ["test-clip"] }
# Snapshot-style assertion library for the cut-templates plan
# tests (HZ-NEXT-CUT-TEMPLATES). `expect![[r#"..."#]]
# .assert_eq(&actual)` reads better than inline vec![] equality
# for 5+-command sequences, and `UPDATE_EXPECT=1 cargo test` keeps
# the snapshots maintainable when AppCommand variants grow fields.
# Tiny crate, no transitive deps, maintained by matklad — same
# trust profile as anyhow / thiserror.
expect-test = "1.5"
# Blocks on wgpu adapter and device requests in the viewer LUT GPU test.
pollster = { workspace = true }
# The one-time conversion, run over presets the app saved, in a test that
# its readers load them after it (#1126). A test dependency only.
klipp-convert = { path = "../klipp-convert" }

[lints]
workspace = true

[[test]]
name = "generated_rows"
required-features = ["row-recorder"]
