[package]
name = "klipp-ui"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Pulls in the ort-backed BiRefNet implementation. With this on,
# the AI Tools panel auto-registers BiRefNet for Remove Background.
# Requires libonnxruntime.so on the user's machine + ORT_DYLIB_PATH
# pointing at it (see klipp-ml-ort docs).
ai-ort = ["dep:klipp-ml-ort", "klipp-ml-ort/ort"]
# NVIDIA acceleration via ort's CUDA execution provider. Implies
# ai-ort. Requires CUDA 12.8+/cuDNN 9.19+ on the user's machine.
ai-ort-cuda = ["ai-ort", "klipp-ml-ort/cuda"]
# Pulls in the candle-backed MobileSAM implementation. Pure-Rust
# (no C library required at runtime). Auto-registers MobileSAM for
# Isolate Object (click-to-mask).
ai-candle = ["dep:klipp-ml-candle", "klipp-ml-candle/candle"]
# NVIDIA acceleration via candle's CUDA backend.
ai-candle-cuda = ["ai-candle", "klipp-ml-candle/cuda"]

[dependencies]
klipp-color = { workspace = true }
klipp-core = { workspace = true }
klipp-effects = { workspace = true }
klipp-engine = { workspace = true }
klipp-jobs = { path = "../klipp-jobs" }
klipp-nodes = { workspace = true }
klipp-timeline = { workspace = true }
klipp-media = { workspace = true }
klipp-validation = { workspace = true }
klipp-audio = { workspace = true }
klipp-plugin = { workspace = true }
klipp-export = { workspace = true }
klipp-ml = { workspace = true }
klipp-ml-candle = { workspace = true, optional = true }
klipp-ml-ort = { workspace = true, optional = true }
klipp-title = { workspace = true }
klipp-project = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
wgpu = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
tracing = { workspace = true }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
dirs = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
egui_extras = { workspace = true }
chrono = { workspace = true }
bytemuck = { workspace = true }
libc = "0.2"
