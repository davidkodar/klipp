[package]
name = "klipp-convert"
version.workspace = true
edition = "2021"
license.workspace = true
description = "The one-time conversion of Klipp projects to the node-graph format, and its dry run (#997)"
# Tests are listed below: most share tests/all (one link); delete this
# and the [[test]] entries to go back to one binary per file.
autotests = false

[[bin]]
name = "klipp-convert"
path = "src/main.rs"

[lints]
workspace = true

# The converter reads and writes project files itself; it depends on no
# app crate, so what it reads is what is on disk, not what today's app
# would make of it (#1054).
[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
klipp-graph-format = { workspace = true }
klipp-graph-lift = { workspace = true }

[dev-dependencies]
klipp-core = { path = "../klipp-core" }
klipp-effects = { path = "../klipp-effects" }
klipp-media = { path = "../klipp-media" }
klipp-nodes = { path = "../klipp-nodes" }
klipp-project = { path = "../klipp-project", features = ["v1-oracle"] }
klipp-timeline = { path = "../klipp-timeline" }
klipp-compose = { path = "../klipp-compose" }

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "oracle_feature"
path = "tests/oracle_feature.rs"

[[test]]
name = "real_saves"
path = "tests/real_saves.rs"
