[package]
name = "klipp-veylvik"
version.workspace = true
edition = "2021"
license.workspace = true

# Veylvik's engine hosted in Klipp: a composition as a clip source on
# Klipp's GPU device, its footage from Klipp's decoder. Pinned to an exact
# Veylvik revision so every Klipp build names the Veylvik it was tested with;
# a Klipp release pins a Veylvik release tag (`tag = "v0.1.0"`), which
# scripts/release.py checks, unless built with --allow-veylvik-rev.
[dependencies]
veylvik-document = { git = "https://github.com/davidkodar/veylvik", rev = "8bcfd3c" }
veylvik-render = { git = "https://github.com/davidkodar/veylvik", rev = "8bcfd3c" }
veylvik-editor = { git = "https://github.com/davidkodar/veylvik", rev = "8bcfd3c" }
veylvik-io = { git = "https://github.com/davidkodar/veylvik", rev = "8bcfd3c" }
veylvik-preview = { git = "https://github.com/davidkodar/veylvik", rev = "8bcfd3c" }
veylvik-audio = { git = "https://github.com/davidkodar/veylvik", rev = "8bcfd3c" }
wgpu = { workspace = true }
klipp-core = { workspace = true }
klipp-media = { workspace = true }
klipp-render = { workspace = true }
klipp-color = { workspace = true }
klipp-nodes = { workspace = true }
klipp-compose = { workspace = true }
klipp-timeline = { workspace = true }
klipp-effects = { workspace = true }
klipp-analysis = { workspace = true }
klipp-plugin = { workspace = true }
bytemuck = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
klipp-title = { workspace = true }
png = "0.18"
klipp-timeline = { workspace = true, features = ["test-clip"] }
