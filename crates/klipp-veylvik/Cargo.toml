[package]
name = "klipp-veylvik"
version.workspace = true
edition = "2021"
license.workspace = true

# Veylvik's engine hosted in Klipp: a composition as a clip source on
# Klipp's GPU device, its footage from Klipp's decoder. Pinned to an exact
# Veylvik revision so every Klipp build names the Veylvik it was tested with.
[dependencies]
veylvik-document = { git = "https://github.com/davidkodar/veylvik", rev = "4fb1a91" }
veylvik-render = { git = "https://github.com/davidkodar/veylvik", rev = "4fb1a91" }
veylvik-editor = { git = "https://github.com/davidkodar/veylvik", rev = "4fb1a91" }
wgpu = { workspace = true }
klipp-core = { workspace = true }
klipp-color = { workspace = true }
klipp-nodes = { workspace = true }
