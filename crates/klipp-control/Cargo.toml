[package]
name = "klipp-control"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# Control surface for a running Klipp instance.
#
# A line-delimited JSON protocol over a Unix socket, so external tools
# (klipp-mcp, scripts, tests) can drive the app and read its state
# without a GUI in the loop.
#
# Deliberately its own vocabulary rather than exposing `AppCommand`:
# that enum has 566 variants and is internal, so serialising it would
# make every refactor a breaking change for anything on the other end
# of the socket. `ControlCommand` is small, stable, and maps *into*
# AppCommand.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
klipp-color = { workspace = true }
klipp-ml = { workspace = true }
klipp-core = { workspace = true }
klipp-document = { workspace = true }
klipp-timeline = { workspace = true }
klipp-media = { workspace = true }
klipp-audio = { workspace = true }
klipp-audio-search = { workspace = true }
klipp-engine = { workspace = true }
klipp-analysis = { workspace = true }
klipp-nodes = { workspace = true }
klipp-effects = { workspace = true }
klipp-compose = { workspace = true }
klipp-render = { workspace = true }
klipp-title = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
png = "0.18"

[dev-dependencies]
klipp-document = { workspace = true }
klipp-timeline = { workspace = true }

[features]
# The UI's effect commands over the socket (`effect_command`): live checks of
# the UI's writers and M3's inspector parity checks. Off by default, never
# in a release build.
test-hooks = []

[lints]
workspace = true
