[package]
name = "klipp-graph-lift"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Klipp's pictures in revision 2 and back, as pure functions: the lift, delift, the splice, paths and the revision-2 conversion (#997, #1089)"

[lints]
workspace = true

# Pure functions over the files' JSON and the graph format. The app may
# depend on this crate; it depends on no app crate itself, only on the
# effect catalog (klipp-effects, which the graph format already pulls in
# through klipp-nodes) to hold an effect's values as typed params (M3-2),
# and on klipp-nodes (which the graph format pulls in too) to set a grade
# node's parameter by path as the grade sets it (`apply_override`).
[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
klipp-graph-format = { workspace = true }
klipp-effects = { path = "../klipp-effects" }
klipp-nodes = { path = "../klipp-nodes" }
