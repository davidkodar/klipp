[package]
name = "klipp-hdr-out"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "klipp_hdr_out"
path = "src/lib.rs"

[[bin]]
name = "klipp-hdr-out"
path = "src/main.rs"

[dependencies]
bytemuck = { workspace = true }
memmap2 = "0.9"
half = "2"
tracing = { workspace = true }

# Presenter only.
wgpu = { workspace = true }
winit = "0.30"
pollster = "0.3"
tracing-subscriber = { workspace = true }

[dev-dependencies]
half = "2"
# Validates the presenter's WGSL with no GPU (#2344); the same naga
# wgpu builds.
naga = { version = "22", features = ["wgsl-in"] }

[lints]
workspace = true
