[package]
name = "klipp-mcp"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# Model Context Protocol server for Klipp.
#
# Speaks MCP (JSON-RPC 2.0 over stdio) to a client such as Claude Code,
# and forwards to a running Klipp via its control socket. Lets an agent
# inspect the timeline, drive playback, apply grades and look at the
# actual viewer output.
#
# Depends on klipp-control only for the wire types, so the two cannot
# drift apart.

[[bin]]
name = "klipp-mcp"
path = "src/main.rs"

[dependencies]
klipp-control = { workspace = true }
klipp-core = { workspace = true }
klipp-document = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
