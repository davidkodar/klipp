[package]
name = "klipp-readiness"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# M4's readiness gate: what every execution family owes, across the
# entries it can be placed in and the routes that draw it, and what its
# tests earn. Test-only, as klipp-testing is: nothing here reaches a
# release binary. The families' cases bring their own dev-dependencies
# as they're written.

[lib]
path = "src/lib.rs"

[dependencies]
# The Format family's cases convert real projects (M4 step F); the
# catalog says where a node type can be placed, and what it converts.
klipp-convert = { path = "../klipp-convert" }
# The routes the families' cases render through (`route`).
klipp-compose = { path = "../klipp-compose" }
klipp-plugin = { path = "../klipp-plugin" }
klipp-title = { path = "../klipp-title" }
klipp-core = { path = "../klipp-core" }
klipp-effects = { path = "../klipp-effects" }
klipp-graph-format = { workspace = true }
klipp-media = { path = "../klipp-media" }
klipp-nodes = { path = "../klipp-nodes" }
klipp-project = { path = "../klipp-project" }
klipp-timeline = { path = "../klipp-timeline" }
serde_json = { workspace = true }

[lints]
workspace = true
