[package]
name = "klipp-app"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
# AI features ship by default so `cargo r` produces a fully-loaded
# Klipp without env prefixes or extra flags. Opt into CUDA tiers
# explicitly with `--features ai-ort-cuda,ai-candle-cuda` (or a
# single one) when the local toolchain has nvcc. Strip everything
# AI with `--no-default-features`.
# The CUDA provider is on by default: without a GPU build of the ONNX
# runtime on the machine it is refused at run time and the CPU provider
# carries on, so it costs nothing where it cannot help.
default = ["ai-ort", "ai-ort-cuda", "ai-candle"]
ai-ort = ["klipp-ui/ai-ort"]
# The control socket's test hooks (klipp-control): never in a release build.
test-hooks = ["klipp-control/test-hooks", "klipp-ui/test-hooks"]
ai-ort-cuda = ["klipp-ui/ai-ort-cuda"]
ai-candle = ["klipp-ui/ai-candle"]
ai-candle-cuda = ["klipp-ui/ai-candle-cuda"]

[dependencies]
klipp-core = { workspace = true }
klipp-document = { workspace = true }
klipp-ui = { workspace = true }
klipp-control = { workspace = true }
klipp-engine = { workspace = true }
klipp-effects = { workspace = true }
klipp-jobs = { path = "../klipp-jobs" }
klipp-timeline = { workspace = true }
klipp-media = { workspace = true }
klipp-title = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
ffmpeg-next = { workspace = true }
png = "0.18"
libc = "0.2"

[lints]
workspace = true
