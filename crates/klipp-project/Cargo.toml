[package]
name = "klipp-project"
version.workspace = true
edition = "2021"
license.workspace = true
# Tests are listed below: most share tests/all (one link); delete this
# and the [[test]] entries to go back to one binary per file.
autotests = false

[dependencies]
klipp-core = { workspace = true }
klipp-graph-lift = { workspace = true }
# A template's starter content names the plug-ins its clips run (#618).
klipp-graph-format = { workspace = true }
klipp-effects = { workspace = true }
klipp-nodes = { workspace = true }
klipp-timeline = { workspace = true }
klipp-media = { workspace = true }
klipp-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
pathdiff = { workspace = true }
# Where Klipp keeps the OpenTimelineIO converter it installs (#2086).
dirs = { workspace = true }
roxmltree = "0.20"
zip = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# step_f_saves builds its clips with TestClip.
klipp-timeline = { workspace = true, features = ["test-clip"] }

[lints]
workspace = true

[features]
# Today's v1 reader and writer, kept only to prove the one-time conversion
# (#1089): klipp-convert's tests compare the conversion with them. The app
# reads and writes revision 2 and never builds with this; klipp-convert's
# `oracle_feature` test fails if the app's normal build has it. A workspace
# `cargo test` unifies features, so the app crates' own tests see it on,
# which is harmless. Removed once the conversion has run and been verified.
v1-oracle = []

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "half_converted_refused"
path = "tests/half_converted_refused.rs"

[[test]]
name = "json_floats"
path = "tests/json_floats.rs"

[[test]]
name = "made_media_is_adopted"
path = "tests/made_media_is_adopted.rs"

[[test]]
name = "old_reader_refuses_title_v2"
path = "tests/old_reader_refuses_title_v2.rs"

[[test]]
name = "every_test_file_runs"
path = "tests/every_test_file_runs.rs"
