[package]
name = "klipp-effects"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
bytemuck = { workspace = true }
# Used by `FocalRef::Glyph` to identify the title clip without
# depending on `klipp-core` (which would close the dep cycle —
# klipp-core already depends on us). See the BlendMode pattern
# below: callers in klipp-core re-export `FocalRef` and convert
# between `ClipId` and the raw uuid at the boundary.
uuid = { workspace = true }
# rayon brings the parallel chunked composite path moved here from
# klipp-engine in Phase 4G. klipp-core can NOT be a regular dep
# because klipp-core already depends on klipp-effects (via the
# `BuiltinEffect` payloads on AppCommand) — we'd close a cycle.
# Instead `BlendMode` is defined here and re-exported from klipp-core
# for backward compatibility with existing call-site paths.
rayon = { workspace = true }
# frei0r 1.x video-plugin host. Lives in its own crate so the
# dlopen + unsafe FFI surface is isolated from the rest of klipp-effects
# (mirrors how klipp-plugin isolates the OFX FFI). `BuiltinEffect::Frei0r`
# carries the type_id + Frei0rValue param list; the runtime cache here
# resolves type_id → Arc<Frei0rPlugin> on first use.
klipp-frei0r = { workspace = true }
# `image` powers the u8 RGBA bilinear resize used by the legacy u8
# composite path (`composite::scale_rgba`). Same crate version as
# klipp-engine, png-only feature set since PNG is the only format
# the resize fallback ever sees.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
klipp-color = { workspace = true }
klipp-core = { workspace = true }
klipp-testing = { workspace = true }
serde_json = { workspace = true }
# naga is a transitive dep of wgpu (same version pin); using it
# directly in tests parses our WGSL strings without needing a GPU.
naga = { version = "22", features = ["wgsl-in"] }
