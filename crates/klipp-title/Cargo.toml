[package]
name = "klipp-title"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
klipp-core = { path = "../klipp-core" }
klipp-timeline = { path = "../klipp-timeline" }
# Half floats for the raster the renderer hands on (#190).
half = { workspace = true }
fontdue = "0.9"
# OpenType shaping for titles (#1501): kerning, ligatures and per-run
# features. Pure Rust; both forbid unsafe code.
harfrust = "=0.13.3"
read-fonts = { version = "=0.43.3", default-features = false }
# A variable font's instance outlines and advances (#1504): fontdue
# draws only a face's default instance. Already in the lockfile;
# forbids unsafe code.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "variable-fonts", "gvar-alloc"] }
# Mixed-direction text and complex scripts (#1502): the Unicode bidi
# algorithm per paragraph, and each character's script for shaping a
# run in its own. MIT or Apache-2.0. unicode-script has no unsafe code;
# unicode-bidi has one block, a slice cast of a repr(transparent) type.
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
# Which characters stand upright in vertical text and which turn
# sideways (UAX #50) (#1507). MIT or Apache-2.0; forbids unsafe code.
unicode-vo = "=0.1.0"
# fontdue's line breaker, taken out so lines break by shaped widths at
# fontdue's own break opportunities (#1693).
klipp-linebreak = { path = "../klipp-linebreak" }
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
klipp-testing = { workspace = true }

[lints]
workspace = true
