[package]
name = "klipp-render"
version.workspace = true
edition = "2021"
license.workspace = true
# Tests are listed below: most share tests/all (one link); delete this
# and the [[test]] entries to go back to one binary per file.
autotests = false

[dependencies]
klipp-core        = { workspace = true }
klipp-transitions = { workspace = true }
klipp-audio    = { workspace = true }
klipp-timeline = { workspace = true }
klipp-media    = { workspace = true }
klipp-color    = { workspace = true }
klipp-effects  = { workspace = true }
klipp-nodes    = { workspace = true }
klipp-plugin   = { workspace = true }
klipp-title    = { workspace = true }
klipp-compose  = { workspace = true }
klipp-analysis = { workspace = true }
klipp-captions = { workspace = true }
ffmpeg-next    = { workspace = true }
bytemuck       = { workspace = true }
wgpu           = { workspace = true }
uuid           = { workspace = true }
tracing        = { workspace = true }
rayon          = { workspace = true }
thiserror      = { workspace = true }
# An analysis an export runs is kept as its asset's JSON (M4 step 9).
serde_json     = { workspace = true }
# The shared offline pixel-check routes write PNG references.
image          = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
klipp-document = { workspace = true }
klipp-testing = { workspace = true }
klipp-project = { workspace = true }
klipp-graph-lift = { workspace = true }
klipp-graph-format = { workspace = true }
tracing-subscriber = { workspace = true }
klipp-core     = { workspace = true }
klipp-timeline = { workspace = true, features = ["test-clip"] }
klipp-media    = { workspace = true }
klipp-nodes    = { workspace = true }
# The renderer's test-only fault (`klipp_compose::fault`, #1276).
klipp-compose  = { workspace = true, features = ["fault-hook"] }
serial_test    = "3"
serde_json     = { workspace = true }

# Its tests guard the reference it records: run them with the crate's.
[[example]]
name = "pixel_check"
test = true

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "audio_crossfade"
path = "tests/audio_crossfade.rs"

[[test]]
name = "export_audio_lands_where_the_timeline_says"
path = "tests/export_audio_lands_where_the_timeline_says.rs"

[[test]]
name = "export_holds_a_still"
path = "tests/export_holds_a_still.rs"

[[test]]
name = "export_stops_on_a_broken_source"
path = "tests/export_stops_on_a_broken_source.rs"

[[test]]
name = "export_viewer_parity"
path = "tests/export_viewer_parity.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "tenbit_convert_probe"
path = "tests/tenbit_convert_probe.rs"

[[test]]
name = "trim_path_export"
path = "tests/trim_path_export.rs"

[[test]]
name = "vector_path_export"
path = "tests/vector_path_export.rs"
