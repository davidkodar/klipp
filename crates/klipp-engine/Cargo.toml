[package]
name = "klipp-engine"
version.workspace = true
edition = "2021"
license.workspace = true
# Tests are listed below: most share tests/all (one link); delete this
# and the [[test]] entries to go back to one binary per file.
autotests = false

[dependencies]
klipp-core = { workspace = true }
klipp-transitions = { workspace = true }
klipp-effects = { workspace = true }
klipp-compose = { workspace = true }
klipp-analysis = { workspace = true }
klipp-graph-format = { workspace = true }
klipp-media = { workspace = true }
klipp-timeline = { workspace = true }
klipp-nodes = { workspace = true }
klipp-audio = { workspace = true }
klipp-color = { workspace = true }
klipp-hdr-out = { workspace = true }
klipp-plugin = { workspace = true }
klipp-title = { workspace = true }
# The export's loudness measurement, run for playback (#1565).
klipp-render = { workspace = true }
klipp-jobs = { path = "../klipp-jobs" }
ffmpeg-next = { workspace = true }
cpal = { workspace = true }
ringbuf = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lz4_flex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
klipp-timeline = { workspace = true, features = ["test-clip"] }
klipp-project = { workspace = true }
tracing-subscriber = { workspace = true }
klipp-graph-lift = { workspace = true }
klipp-testing = { workspace = true }
pollster = "0.3"
kamadak-exif = "0.6"

[lints]
workspace = true

