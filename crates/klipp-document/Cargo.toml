[package]
name = "klipp-document"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# The document: what a project is when nothing is looking at it. The
# edit history (every undoable command with its forward and inverse
# application), and the view of the sequences and the media pool those
# applications run against. The UI, the control socket and any
# assistant are clients of this; the playback engine reads snapshots
# of it and never edits.
#
# No egui, no engine, no device: a test drives an edit and undoes it
# with nothing but a sequence in memory.

[dependencies]
# Word boundaries in caption text written without spaces (#3238).
klipp-linebreak = { path = "../klipp-linebreak" }
klipp-graph-lift = { workspace = true }
klipp-core = { workspace = true }
klipp-timeline = { workspace = true }
klipp-graph-format = { workspace = true }
klipp-color = { workspace = true }
klipp-media = { workspace = true }
klipp-nodes = { workspace = true }
klipp-effects = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
klipp-timeline = { workspace = true, features = ["test-clip"] }
klipp-graph-format = { workspace = true }
klipp-plugin = { workspace = true }
uuid = { workspace = true }
# The measured sweeps (tests/sweep_*.rs) render and save what the ops make.
klipp-compose = { workspace = true }
klipp-title = { workspace = true }
klipp-project = { workspace = true }
klipp-testing = { workspace = true }

[lints]
workspace = true
