[package]
name = "klipp-compose"
version.workspace = true
edition = "2021"
license.workspace = true
description = "One definition of how a timeline frame is rendered, shared by the viewer and export"
# Tests are listed below: most share tests/all (one link); delete this
# and the [[test]] entries to go back to one binary per file.
autotests = false

[dependencies]
klipp-core        = { workspace = true }
klipp-timeline    = { workspace = true }
klipp-nodes       = { workspace = true }
klipp-effects     = { workspace = true }
klipp-color       = { workspace = true }
klipp-title       = { workspace = true }
klipp-transitions = { workspace = true }
klipp-plugin      = { workspace = true }
klipp-analysis    = { workspace = true }
klipp-graph-format = { workspace = true }
klipp-graph-lift  = { workspace = true }
serde_json        = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
rayon             = { workspace = true }
tracing           = { workspace = true }

[dev-dependencies]
# Its own test-only fault (`fault`), on for its tests alone.
klipp-compose = { workspace = true, features = ["fault-hook"] }
klipp-timeline = { workspace = true, features = ["test-clip"] }
klipp-color = { workspace = true }
klipp-frei0r = { workspace = true }
# The golden corpus's stored frames are one PNG (#1089); title image
# layers are read from PNG and JPEG (#2077).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = { workspace = true }
# Reading a generator's half-float frame in its tests (#190).
half = { workspace = true }

[features]
# A test-only fault on a clip's grade run (`fault`, #1276): turned on only
# by dev-dependencies.
fault-hook = []

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all/main.rs"

[[test]]
name = "analysis_nodes_read_the_source_frame"
path = "tests/analysis_nodes_read_the_source_frame.rs"

[[test]]
name = "effects_follow_grade"
path = "tests/effects_follow_grade.rs"

[[test]]
name = "masked_effect_off_grade"
path = "tests/masked_effect_off_grade.rs"

[[test]]
name = "native_effect_order"
path = "tests/native_effect_order.rs"

[[test]]
name = "plan_lifts_once"
path = "tests/plan_lifts_once.rs"

[[test]]
name = "title_fallback_tally"
path = "tests/title_fallback_tally.rs"

[[test]]
name = "title_styles_gpu"
path = "tests/title_styles_gpu.rs"
