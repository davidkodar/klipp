[package]
name = "klipp-analysis"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# What is in the footage, as facts: shot boundaries, loudness and
# silence, later the words and the framing. Deterministic passes over a
# media file, cached beside Klipp's other caches by the file's cache
# key, read by the control socket, the timeline view and the UI.
#
# Each analyser is a plugin behind one trait with a versioned output;
# what runs it (ffmpeg here, a model later) is its own business, and an
# analyser that is missing leaves its fields empty and nothing else
# changes.

[features]
# The transcript analyser: whisper.cpp built from source through
# whisper-rs (cmake and a C++ toolchain). On by default so the app has
# it; `--no-default-features` leaves the ffmpeg analysers only.
default = ["transcript", "framing", "ocr", "subject_matte", "audio_role"]
transcript = ["dep:whisper-rs", "dep:klipp-ml"]
# The framing analyser: RF-DETR through ONNX Runtime (`load-dynamic`:
# the library is found at run time, never downloaded at build time).
framing = ["dep:klipp-ml-ort", "klipp-ml-ort/ort", "dep:klipp-ml"]
ocr = ["dep:klipp-ml-ort", "klipp-ml-ort/ort", "dep:klipp-ml"]
# The subject matte pass (#239): a segmentation model over every frame
# of a range, kept as a matte sequence an ExternalMatte reads.
subject_matte = ["dep:klipp-ml-ort", "klipp-ml-ort/ort", "dep:klipp-ml", "dep:klipp-nodes"]
# NVIDIA acceleration for the framing and screen-text models through
# ONNX Runtime's CUDA provider; needs a GPU build of libonnxruntime
# with CUDA 12 and cuDNN 9 on the machine at run time, else the
# provider is refused and the CPU provider carries on.
# What a file's sound is (#2216): PANNs Cnn10 in candle, pure Rust.
audio_role = ["dep:klipp-ml-candle", "klipp-ml-candle/candle", "dep:klipp-ml"]
cuda = ["klipp-ml-ort/cuda", "klipp-ml-candle?/cuda"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
klipp-audio = { workspace = true }
klipp-core = { workspace = true }
klipp-jobs = { path = "../klipp-jobs" }
klipp-media = { workspace = true }
realfft = "3"
klipp-ml = { workspace = true, optional = true }
klipp-ml-ort = { workspace = true, optional = true }
klipp-ml-candle = { workspace = true, optional = true }
klipp-nodes = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
whisper-rs = { version = "0.16", optional = true, features = ["vulkan"] }

[lints]
workspace = true

[dev-dependencies]
klipp-ml-candle = { workspace = true }
tracing-subscriber = { workspace = true }
