# cargo-deny configuration for Klipp.
#
# Closes (the config side). The CI integration
# side (DEP-CI-UDEPS for udeps and a wired-in cargo audit/deny job)
# is tracked separately as it depends on CI workflow infrastructure
# that lives outside the source tree.
#
# Usage:
#   cargo deny check          # all sections below
#   cargo deny check advisories
#   cargo deny check licenses
#   cargo deny check bans
#   cargo deny check sources
#
# Schema reference:
#   https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─── Security advisories (RustSec database) ─────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked-version warnings are common in long-tail transitive deps;
# treat as warn so they surface in CI logs without failing the build
# when the only fix is upstream.
yanked = "warn"
# Advisories that cannot reach Klipp, or have no fix yet, each with why
# (#825). Everything else is fixed by updating; a new advisory still
# fails the check until it is fixed or added here with a reason.
ignore = [
  # quick-xml 0.30 (accesskit's D-Bus layer) and 0.39 (the Wayland
  # protocol scanner, at build time): both parse trusted local XML, the
  # bus's introspection data and the protocol files, never a user's or
  # the network's. The fix (0.41) needs accesskit, zbus and winit to move.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml parses only trusted local XML (D-Bus introspection, Wayland protocol files); fix waits on accesskit/zbus/winit" },
  { id = "RUSTSEC-2026-0195", reason = "as RUSTSEC-2026-0194" },
  # ringbuf: the double free needs an element whose Drop panics. Klipp's
  # engine buffers f32 samples and livi's LV2 worker plain bytes; neither
  # has a Drop at all. The fix (0.5) changes ringbuf's API.
  { id = "RUSTSEC-2026-0293", reason = "ring buffers hold f32 (klipp-engine) and u8 (livi); no Drop can panic; fix is the 0.5 API" },
  # tract-nnef, under tract-onnx for the voice isolation effect: the
  # overflow is in the NNEF parser. Klipp loads ONNX models, fetched by
  # hash from its model manifest, never NNEF. The fix needs tract 0.21+.
  { id = "RUSTSEC-2026-0217", reason = "only hash-verified ONNX models are loaded, never NNEF; fix needs tract 0.21+" },
  # ZIP extraction advisories (#2140): klipp-project copies enclosed
  # entries into fresh regular files, without applying archive modes or
  # creating links; consolidation only writes ZIPs. Candle 0.8 reads ZIP
  # members into tensor/pickle readers, never filesystem extraction.
  { id = "RUSTSEC-2026-0367", reason = "klipp-project and Candle do not use ZIP filesystem extraction or apply archive permissions; reassess if extraction usage changes, remove once both zip dependencies reach 9+ (#2140)" },
  { id = "RUSTSEC-2026-0368", reason = "klipp-project and Candle do not use ZIP filesystem extraction or create archive symlinks; reassess if extraction usage changes, remove once both zip dependencies reach 9+ (#2140)" },
  { id = "RUSTSEC-2026-0369", reason = "klipp-project and Candle do not use ZIP filesystem extraction or chmod through archive symlinks; reassess if extraction usage changes, remove once both zip dependencies reach 9+ (#2140)" },
  # These standalone D-Bus crates moved into zbus 6; no patched release
  # exists under their old names. eframe 0.29's AccessKit/AT-SPI stack
  # still needs zbus 4.
  { id = "RUSTSEC-2026-0370", reason = "zvariant is transitive through eframe/AccessKit/AT-SPI; remove when that stack migrates to zbus 6 and its wire module (#2140)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is transitive through eframe/AccessKit/AT-SPI; remove when that stack migrates to zbus 6 and its names module (#2140)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is transitive through eframe/AccessKit/AT-SPI; remove when that stack migrates to zbus 6 and its macros (#2140)" },
  # Unmaintained, with no maintained release to move to yet.
  { id = "RUSTSEC-2026-0319", reason = "anymap2, unmaintained, via egui; no replacement upstream yet" },
  { id = "RUSTSEC-2024-0384", reason = "instant, unmaintained, transitive; no fix" },
  { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, transitive; no fix" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained, via font crates; no fix" },
]

# ─── Licenses ───────────────────────────────────────────────────────
[licenses]
# Klipp is GPL-3.0-only. That is the outward-facing fact this list has
# to serve, and it was wrong here for a long time: the comment used to
# say "Klipp is itself a proprietary app", which it is not and has not
# been.
#
# Being GPL makes this check *looser*, not tighter — GPL-3.0 can absorb
# anything permissive, so the job here is only to catch a dependency
# that is copyleft in a way GPL-3.0 cannot take (a GPL-2.0-only crate,
# say, or AGPL arriving without anyone noticing).
allow = [
    # Our own 33 crates, which say so themselves via workspace.package.
    "GPL-3.0-only",

    # The ordinary permissive set.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",

    # Boost. Permissive, no attribution required for binaries.
    # clipboard-win, error-code.
    "BSL-1.0",

    # ffmpeg-next and ffmpeg-sys-next, the Rust bindings, are WTFPL —
    # effectively public domain. Note this says nothing about the
    # ffmpeg *library* they bind, which is GPL-3.0 as distributions
    # build it (--enable-gpl, for x264/x265) and is the reason Klipp
    # is GPL at all.
    "WTFPL",

    # Public-domain dedication. Used by a few small crates.
    "Unlicense",

    # CDLA-Permissive-2.0: a data licence, permissive.
    "CDLA-Permissive-2.0",

    # Font licences, from epaint_default_fonts — these cover the font
    # files egui bundles, not code, and both permit redistribution.
    # UFL is not an SPDX id, hence the LicenseRef form.
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.8
exceptions = []

# ─── Banned crates / version pins ───────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Tracker entries DEP-ROXMLTREE-DUP and (the transitive remnant of)
# DEP-PNG-ALIGN both surface as "multiple-versions" warnings on
# crates we can't deduplicate without bumping upstream egui/resvg.
# Annotate them as known-acceptable so a fresh duplicate (one we
# CAN fix) stands out in CI noise.
skip = [
    # Pulled by tiny-skia → resvg → egui_extras (and sctk-adwaita →
    # winit). Our direct deps are aligned at 0.18; the 0.17 dup is
    # third-party transitive.
    { name = "png", version = "0.17" },
    # Pulled by usvg-parser → resvg → egui_extras. Our direct dep
    # is 0.20.
    { name = "roxmltree", version = "0.19" },
]
skip-tree = []
deny = []

# ─── Source registries ──────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
