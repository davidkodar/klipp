[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    # target-cpu=native enables AVX2 (and AVX-VNNI on Intel 13th/14th gen)
    # so LLVM auto-vectorizes the stride-4 loop in composite.rs:blend_chunk.
    # Safe: zero #[cfg(target_feature)] guards in Klipp source; wgpu/egui
    # build scripts do platform cfgs only; ffmpeg-sys-next links against
    # system libavcodec.so which is unaffected.
    "-C", "target-cpu=native",
]

[env]
# 512 MB. The release-profile LTO pass on klipp-app blows past
# 128 MB and 256 MB after recent klipp-ui growth; rustc's diagnostic
# kept suggesting larger values until 512 MB, which holds. The
# stack is per-rustc-thread so the wall-clock cost is minimal.
RUST_MIN_STACK = "536870912"

[alias]
r = "run -p klipp-app"
rr = "run --release -p klipp-app"
b = "build -p klipp-app"
c = "clippy --workspace"
