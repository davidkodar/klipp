[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    # target-cpu=native enables AVX2 (and AVX-VNNI on Intel 13th/14th gen)
    # so LLVM auto-vectorizes the stride-4 loop in composite.rs:blend_chunk.
    # Safe: zero #[cfg(target_feature)] guards in Klipp source; wgpu/egui
    # build scripts do platform cfgs only; ffmpeg-sys-next links against
    # system libavcodec.so which is unaffected.
    "-C", "target-cpu=native",
]

[target.aarch64-unknown-linux-gnu]
# The same linker setup as x86_64, for Apple Silicon under Asahi and other
# ARM64 Linux machines. lld matters more here than its speed: GNU ld took
# 1.2-1.3 GB a test binary, and eight of them at once ran a 16 GB Mac mini
# out of memory. target-cpu=native is apple-m1 or newer on Asahi.
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-cpu=native",
]

[env]
# 512 MB. The release-profile LTO pass on klipp-app blows past
# 128 MB and 256 MB after recent klipp-ui growth; rustc's diagnostic
# kept suggesting larger values until 512 MB, which holds. The
# stack is per-rustc-thread so the wall-clock cost is minimal.
RUST_MIN_STACK = "536870912"
# The speech model runs on the GPU through Vulkan (any vendor's), and
# whisper.cpp's build wants an SDK directory: scripts/vulkan-sdk.sh lays
# one out here from the system's headers, or Khronos's when it has none.
VULKAN_SDK = { value = "vendor/vulkan-sdk", relative = true }

[alias]
r = "run -p klipp-app"
rr = "run --release -p klipp-app"
b = "build -p klipp-app"
c = "clippy --workspace"
# CUDA-accelerated ML inference. Two tiers because the build-time
# requirements differ:
#
#   *-ort-cuda  — ort with CUDA EP via load-dynamic. No nvcc needed.
#                 Covers BiRefNet + RF-DETR-Seg.
#   *-cuda      — full GPU AI (ort + candle). Requires CUDA Toolkit
#                 (nvcc) on PATH because cudarc compiles kernels at
#                 build. Covers MobileSAM in addition to ort models.
#
# Plain `cargo r` still gives full AI on CPU. Released binaries will
# build with the full set unconditionally once the release pipeline
# is in place.
r-ort-cuda = "run -p klipp-app --features ai-ort-cuda"
rr-ort-cuda = "run --release -p klipp-app --features ai-ort-cuda"
r-cuda = "run -p klipp-app --features ai-ort-cuda,ai-candle-cuda"
rr-cuda = "run --release -p klipp-app --features ai-ort-cuda,ai-candle-cuda"
b-cuda = "build -p klipp-app --features ai-ort-cuda,ai-candle-cuda"
